# Canonical list of models used in experiments, plus CBUS capacity (C)
# configuration. This is the single source of truth consumed by the
# simulation, evaluation, plotting, status, and experiment-runner scripts.
#
# For each model:
#   id    – full "<provider>/<model>" string passed to run_simulation's
#           --model flag.
#   label – human-readable name used in LaTeX tables and plots.
# The short name that appears in data/simulation/ directory names is the
# part of `id` after the last '/', e.g. "llama-3.3-70b-instruct".

default_provider: openrouter

models:
  - id: meta-llama/llama-3.3-70b-instruct
    label: Llama-3.3-70B-Instruct
  - id: mistralai/mixtral-8x22b-instruct
    label: Mixtral-8x22B-Instruct
  - id: openai/gpt-4o-mini
    label: GPT-4o-mini
  - id: openai/gpt-5.4
    label: GPT-5.4
  - id: google/gemini-3.5-flash-lite
    label: Gemini-3.5-Flash-Lite
  - id: google/gemini-3.7-flash
    label: Gemini-3.7-Flash

# CBUS working-memory capacity (C). `default` is used when --capacity is
# omitted on the command line; `sweep` defines the columns of the
# parameter-sweep matrices and the values run by `run_experiments.py sweep`.
cbus:
  ts:
    default: 2
    sweep: [1, 2, 3, 4, 5]
  spr:
    default: 4
    sweep: [2, 4, 6, 8, 10, 12]
